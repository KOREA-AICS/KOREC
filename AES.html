#include <vector>
#include <cstdint>

/**
 * @class AES_Optimized
 * @brief An AES implementation based on the FIPS-197 standard, optimized with T-Tables.
 *
 * This class supports AES-128, AES-192, and AES-256. The core encryption and
 * decryption routines are accelerated using pre-computed lookup tables (T-Tables),
 * which combine SubBytes, ShiftRows, and MixColumns into a single table lookup
 * operation per column.
 */
class AES_Optimized {
private:
    // --- FIPS-197 Standard Constant Tables ---
    static const uint8_t s_box[256];
    static const uint8_t inv_s_box[256];
    static const uint8_t Rcon[11];

    // --- T-Tables for Optimization ---
    // Encryption and decryption lookup tables merge multiple AES steps.
    uint32_t Te0[256], Te1[256], Te2[256], Te3[256]; // Encryption T-Tables
    uint32_t Td0[256], Td1[256], Td2[256], Td3[256]; // Decryption T-Tables

    // Round keys stored as 32-bit words.
    std::vector<uint32_t> round_keys;
    // Decryption round keys, pre-computed by applying InvMixColumns.
    // This is necessary because the T-Table optimization changes the operation order.
    std::vector<uint32_t> dec_round_keys;

    uint8_t gmul(uint8_t a, uint8_t b) {
        uint8_t p = 0;
        for (int i = 0; i < 8; i++) {
            if (b & 1) { p ^= a; }
            bool hi_bit_set = (a & 0x80);
            a <<= 1;
            if (hi_bit_set) { a ^= 0x1B; }
            b >>= 1;
        }
        return p;
    }

    void build_tables() {
        for (int i = 0; i < 256; i++) {
            uint8_t s = s_box[i];
            uint8_t s2 = gmul(s, 2);
            uint8_t s3 = gmul(s, 3);
            uint32_t te_val = (static_cast<uint32_t>(s2) << 24) | (static_cast<uint32_t>(s) << 16) | (static_cast<uint32_t>(s) << 8) | static_cast<uint32_t>(s3);
            Te0[i] = te_val;
            Te1[i] = (te_val >> 8) | (te_val << 24);
            Te2[i] = (te_val >> 16) | (te_val << 16);
            Te3[i] = (te_val >> 24) | (te_val << 8);
            uint8_t is = inv_s_box[i];
            uint8_t is9 = gmul(is, 9), isB = gmul(is, 0xB), isD = gmul(is, 0xD), isE = gmul(is, 0xE);
            uint32_t td_val = (static_cast<uint32_t>(isE) << 24) | (static_cast<uint32_t>(is9) << 16) | (static_cast<uint32_t>(isD) << 8) | static_cast<uint32_t>(isB);
            Td0[i] = td_val;
            Td1[i] = (td_val >> 8) | (td_val << 24);
            Td2[i] = (td_val >> 16) | (td_val << 16);
            Td3[i] = (td_val >> 24) | (td_val << 8);
        }
    }

    uint32_t bytes_to_uint32(const uint8_t* bytes) {
        return (static_cast<uint32_t>(bytes[0]) << 24) | (static_cast<uint32_t>(bytes[1]) << 16) | (static_cast<uint32_t>(bytes[2]) << 8) | static_cast<uint32_t>(bytes[3]);
    }

    void uint32_to_bytes(uint32_t word, uint8_t* bytes) {
        bytes[0] = (word >> 24) & 0xFF;
        bytes[1] = (word >> 16) & 0xFF;
        bytes[2] = (word >> 8) & 0xFF;
        bytes[3] = word & 0xFF;
    }

    void key_expansion(const uint8_t* key, int Nk, int Nr) {
        round_keys.resize(4 * (Nr + 1));
        for (int i = 0; i < Nk; ++i) { round_keys[i] = bytes_to_uint32(key + i * 4); }
        for (int i = Nk; i < 4 * (Nr + 1); ++i) {
            uint32_t temp = round_keys[i - 1];
            if (i % Nk == 0) {
                temp = (s_box[(temp >> 16) & 0xFF] << 24) | (s_box[(temp >> 8) & 0xFF] << 16) | (s_box[temp & 0xFF] << 8) | (s_box[temp >> 24]);
                temp ^= (static_cast<uint32_t>(Rcon[i / Nk]) << 24);
            } else if (Nk > 6 && i % Nk == 4) {
                temp = (s_box[(temp >> 24) & 0xFF] << 24) | (s_box[(temp >> 16) & 0xFF] << 16) | (s_box[(temp >> 8) & 0xFF] << 8) | (s_box[temp & 0xFF]);
            }
            round_keys[i] = round_keys[i - Nk] ^ temp;
        }
    }

    uint32_t inv_mix_columns_word(uint32_t w) {
        uint8_t b[4]; uint32_to_bytes(w, b);
        uint8_t res[4];
        res[0] = gmul(0x0e, b[0]) ^ gmul(0x0b, b[1]) ^ gmul(0x0d, b[2]) ^ gmul(0x09, b[3]);
        res[1] = gmul(0x09, b[0]) ^ gmul(0x0e, b[1]) ^ gmul(0x0b, b[2]) ^ gmul(0x0d, b[3]);
        res[2] = gmul(0x0d, b[0]) ^ gmul(0x09, b[1]) ^ gmul(0x0e, b[2]) ^ gmul(0x0b, b[3]);
        res[3] = gmul(0x0b, b[0]) ^ gmul(0x0d, b[1]) ^ gmul(0x09, b[2]) ^ gmul(0x0e, b[3]);
        return bytes_to_uint32(res);
    }
public:
    AES_Optimized(const uint8_t* key, int key_bits) {
        build_tables();
        int Nk = key_bits / 32, Nr;
        switch(key_bits) {
            case 128: Nr = 10; break;
            case 192: Nr = 12; break;
            case 256: Nr = 14; break;
            default: throw std::invalid_argument("Invalid key size.");
        }
        key_expansion(key, Nk, Nr);
        dec_round_keys = round_keys;
        for (int round = 1; round < Nr; ++round) {
            for (int i = 0; i < 4; ++i) {
                dec_round_keys[round*4+i] = inv_mix_columns_word(round_keys[round*4+i]);
            }
        }
    }
    void encrypt_block(const uint8_t* plaintext, uint8_t* ciphertext) {
        uint32_t s0 = bytes_to_uint32(plaintext) ^ round_keys[0], s1 = bytes_to_uint32(plaintext+4) ^ round_keys[1], s2 = bytes_to_uint32(plaintext+8) ^ round_keys[2], s3 = bytes_to_uint32(plaintext+12) ^ round_keys[3];
        int Nr = round_keys.size()/4-1;
        for (int round=1; round<Nr; ++round) {
            uint32_t t0 = Te0[(s0>>24)&0xFF] ^ Te1[(s1>>16)&0xFF] ^ Te2[(s2>>8)&0xFF] ^ Te3[s3&0xFF] ^ round_keys[round*4];
            uint32_t t1 = Te0[(s1>>24)&0xFF] ^ Te1[(s2>>16)&0xFF] ^ Te2[(s3>>8)&0xFF] ^ Te3[s0&0xFF] ^ round_keys[round*4+1];
            uint32_t t2 = Te0[(s2>>24)&0xFF] ^ Te1[(s3>>16)&0xFF] ^ Te2[(s0>>8)&0xFF] ^ Te3[s1&0xFF] ^ round_keys[round*4+2];
            uint32_t t3 = Te0[(s3>>24)&0xFF] ^ Te1[(s0>>16)&0xFF] ^ Te2[(s1>>8)&0xFF] ^ Te3[s2&0xFF] ^ round_keys[round*4+3];
            s0=t0; s1=t1; s2=t2; s3=t3;
        }
        uint32_t t0 = (static_cast<uint32_t>(s_box[(s0>>24)&0xFF])<<24)|(static_cast<uint32_t>(s_box[(s1>>16)&0xFF])<<16)|(static_cast<uint32_t>(s_box[(s2>>8)&0xFF])<<8)|static_cast<uint32_t>(s_box[s3&0xFF]);
        uint32_t t1 = (static_cast<uint32_t>(s_box[(s1>>24)&0xFF])<<24)|(static_cast<uint32_t>(s_box[(s2>>16)&0xFF])<<16)|(static_cast<uint32_t>(s_box[(s3>>8)&0xFF])<<8)|static_cast<uint32_t>(s_box[s0&0xFF]);
        uint32_t t2 = (static_cast<uint32_t>(s_box[(s2>>24)&0xFF])<<24)|(static_cast<uint32_t>(s_box[(s3>>16)&0xFF])<<16)|(static_cast<uint32_t>(s_box[(s0>>8)&0xFF])<<8)|static_cast<uint32_t>(s_box[s1&0xFF]);
        uint32_t t3 = (static_cast<uint32_t>(s_box[(s3>>24)&0xFF])<<24)|(static_cast<uint32_t>(s_box[(s0>>16)&0xFF])<<16)|(static_cast<uint32_t>(s_box[(s1>>8)&0xFF])<<8)|static_cast<uint32_t>(s_box[s2&0xFF]);
        uint32_to_bytes(t0^round_keys[Nr*4], ciphertext); uint32_to_bytes(t1^round_keys[Nr*4+1], ciphertext+4); uint32_to_bytes(t2^round_keys[Nr*4+2], ciphertext+8); uint32_to_bytes(t3^round_keys[Nr*4+3], ciphertext+12);
    }
    void decrypt_block(const uint8_t* ciphertext, uint8_t* plaintext) {
        int Nr = round_keys.size()/4-1;
        uint32_t s0 = bytes_to_uint32(ciphertext) ^ round_keys[Nr*4], s1 = bytes_to_uint32(ciphertext+4) ^ round_keys[Nr*4+1], s2 = bytes_to_uint32(ciphertext+8) ^ round_keys[Nr*4+2], s3 = bytes_to_uint32(ciphertext+12) ^ round_keys[Nr*4+3];
        for (int round=Nr-1; round>=1; --round) {
            uint32_t t0 = Td0[(s0>>24)&0xFF] ^ Td1[(s3>>16)&0xFF] ^ Td2[(s2>>8)&0xFF] ^ Td3[s1&0xFF] ^ dec_round_keys[round*4];
            uint32_t t1 = Td0[(s1>>24)&0xFF] ^ Td1[(s0>>16)&0xFF] ^ Td2[(s3>>8)&0xFF] ^ Td3[s2&0xFF] ^ dec_round_keys[round*4+1];
            uint32_t t2 = Td0[(s2>>24)&0xFF] ^ Td1[(s1>>16)&0xFF] ^ Td2[(s0>>8)&0xFF] ^ Td3[s3&0xFF] ^ dec_round_keys[round*4+2];
            uint32_t t3 = Td0[(s3>>24)&0xFF] ^ Td1[(s2>>16)&0xFF] ^ Td2[(s1>>8)&0xFF] ^ Td3[s0&0xFF] ^ dec_round_keys[round*4+3];
            s0=t0; s1=t1; s2=t2; s3=t3;
        }
        uint32_t t0 = (static_cast<uint32_t>(inv_s_box[(s0>>24)&0xFF])<<24)|(static_cast<uint32_t>(inv_s_box[(s3>>16)&0xFF])<<16)|(static_cast<uint32_t>(inv_s_box[(s2>>8)&0xFF])<<8)|static_cast<uint32_t>(inv_s_box[s1&0xFF]);
        uint32_t t1 = (static_cast<uint32_t>(inv_s_box[(s1>>24)&0xFF])<<24)|(static_cast<uint32_t>(inv_s_box[(s0>>16)&0xFF])<<16)|(static_cast<uint32_t>(inv_s_box[(s3>>8)&0xFF])<<8)|static_cast<uint32_t>(inv_s_box[s2&0xFF]);
        uint32_t t2 = (static_cast<uint32_t>(inv_s_box[(s2>>24)&0xFF])<<24)|(static_cast<uint32_t>(inv_s_box[(s1>>16)&0xFF])<<16)|(static_cast<uint32_t>(inv_s_box[(s0>>8)&0xFF])<<8)|static_cast<uint32_t>(inv_s_box[s3&0xFF]);
        uint32_t t3 = (static_cast<uint32_t>(inv_s_box[(s3>>24)&0xFF])<<24)|(static_cast<uint32_t>(inv_s_box[(s2>>16)&0xFF])<<16)|(static_cast<uint32_t>(inv_s_box[(s1>>8)&0xFF])<<8)|static_cast<uint32_t>(inv_s_box[s0&0xFF]);
        uint32_to_bytes(t0^round_keys[0], plaintext); uint32_to_bytes(t1^round_keys[1], plaintext+4); uint32_to_bytes(t2^round_keys[2], plaintext+8); uint32_to_bytes(t3^round_keys[3], plaintext+12);
    }
};

                              <h3 class="text-xl font-semibold text-gray-100 mb-3">코드 설명</h3>
                              <div class="text-gray-300 leading-relaxed">${data.explanation}</div>
                          </div>
                       </div>`;

                slideEl.innerHTML = `
                    <h2 class="text-2xl font-bold text-cyan-300 mb-4">${data.title}</h2>
                    ${gridLayout}
                `;
                viewer.appendChild(slideEl);
            });

            const slides = document.querySelectorAll('.slide');

            function showSlide(index) {
                slides.forEach((slide, i) => {
                    slide.classList.toggle('hidden', i !== index);
                });
                
                slideCounter.textContent = `${index + 1} / ${slides.length}`;
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === slides.length - 1;
                Prism.highlightAll();
            }

            viewer.addEventListener('click', (e) => {
                if (e.target.classList.contains('copy-btn')) {
                    const btn = e.target;
                    const codeContainer = btn.closest('.code-container');
                    const codeEl = codeContainer.querySelector('code');
                    if (codeEl) {
                        const codeToCopy = codeEl.innerText;
                        
                        // Use document.execCommand for better iframe compatibility
                        const textArea = document.createElement('textarea');
                        textArea.value = codeToCopy;
                        document.body.appendChild(textArea);
                        textArea.select();
                        try {
                            document.execCommand('copy');
                            btn.textContent = '복사 완료!';
                            setTimeout(() => {
                                btn.textContent = '복사';
                            }, 2000);
                        } catch (err) {
                            console.error('클립보드 복사 실패:', err);
                            btn.textContent = '복사 실패';
                        }
                        document.body.removeChild(textArea);
                    }
                }
            });

            prevBtn.addEventListener('click', () => {
                if (currentSlide > 0) {
                    currentSlide--;
                    showSlide(currentSlide);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    showSlide(currentSlide);
                }
            });

            showSlide(currentSlide);
        });
    </script>
</body>
</html>
